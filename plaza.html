      historia:["Se inauguró junto con el barrio 240 Viviendas.",
        "La comunidad educativa cercana la adoptó como aula al aire libre."],
      equipamiento:["Biblioteca a cielo abierto","Juegos infantiles","Pizarrón comunitario","Bancos"],
      arbolado:["Sereno","Ligustro","Crespón"],
      accesibilidad:"Sendero perimetral accesible.",
      direccion:"Manzana central, Barrio 240 Viviendas."
    },
    "juan-chelemin": {
      nombre:"Plaza Juan Chelemín", barrio:"Sur", anio:"2005", superficie:"0,6 ha", galeria:3,
      intro:"Espacio joven con skatepark, pensado para adolescentes y deporte urbano.",
      historia:["Lleva el nombre del cacique Juan Chelemín, líder de la resistencia calchaquí.",
        "El skatepark se sumó en una remodelación posterior."],
      equipamiento:["Skatepark de hormigón","Iluminación LED","Gradas","Bebederos"],
      arbolado:["Aguaribay","Algarrobo","Mora"],
      accesibilidad:"Acceso a nivel; miradores accesibles hacia el skatepark.",
      direccion:"Av. Presidente Castillo al 1200 — Barrio Sur."
    },
    "sarmiento": {
      nombre:"Plaza Sarmiento", barrio:"Centro", anio:"1911", superficie:"0,2 ha", galeria:3,
      intro:"Plazoleta pequeña y sombreada, con una fuente y naranjos amargos históricos.",
      historia:["Es una de las plazoletas más antiguas del centro.",
        "Su fuente de hierro fue restaurada conservando el diseño original."],
      equipamiento:["Fuente ornamental","Bancos","Iluminación baja"],
      arbolado:["Naranjo amargo","Fresno"],
      accesibilidad:"Solado firme; un acceso con rampa.",
      direccion:"Sarmiento y Mate de Luna — Centro."
    }
  };

  /* ════════════════ RENDER ════════════════ */
  const $ = (s, c = document) => c.querySelector(s);
  function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

  const slug = new URLSearchParams(location.search).get('plaza');
  const d = slug ? PLAZAS_DETALLE[slug] : null;

  if (!d) { render404(); } else { renderFicha(slug, d); }

  function render404() {
    document.title = 'Plaza no encontrada · Catamarca Capital [MOCKUP]';
    $('#miga').innerHTML = `<ol><li><a href="index.html">Inicio</a></li><li><a href="index.html#plazas">Plazas</a></li><li aria-current="page">No encontrada</li></ol>`;
    $('#detalle').innerHTML = `
      <div class="estado" role="alert">
        <i class="bi bi-signpost-2 big" aria-hidden="true"></i>
        <h1>No encontramos esa plaza</h1>
        <p>Puede que el enlace esté mal escrito o que esa plaza todavía no tenga ficha cargada.</p>
        <p><a class="btn-pv" href="index.html#plazas"><i class="bi bi-arrow-left"></i> Volver a todas las plazas</a></p>
        <div class="lista">
          <p class="text-soft mb-1">Plazas con ficha disponible:</p>
          <ul>${PLAZAS.map(s => `<li><a href="plaza.html?plaza=${s}">${esc(PLAZAS_DETALLE[s] ? PLAZAS_DETALLE[s].nombre : s)}</a></li>`).join('')}</ul>
        </div>
      </div>`;
  }

  function renderFicha(slug, d) {
    document.title = `${d.nombre} · Plazas de Catamarca Capital [MOCKUP]`;

    $('#miga').innerHTML = `<ol>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="index.html#plazas">Plazas</a></li>
      <li aria-current="page">${esc(d.nombre)}</li>
    </ol>`;

    const idx = PLAZAS.indexOf(slug);
    const prev = idx > 0 ? PLAZAS[idx - 1] : null;
    const next = idx < PLAZAS.length - 1 ? PLAZAS[idx + 1] : null;

    const galeria = Array.from({ length: d.galeria || 3 }, (_, k) => {
      const n = k + 1;
      return `<button type="button" data-img="assets/img/plazas/galeria/plaza-${slug}-${n}.jpg" data-cap="${esc(d.nombre)} — foto ${n}">
        <img src="assets/img/plazas/galeria/plaza-${slug}-${n}.jpg" alt="${esc(d.nombre)}, imagen ${n} de ${d.galeria}"
             loading="lazy" onerror="this.outerHTML='<div class=&quot;ph&quot;><i class=&quot;bi bi-image&quot;></i></div>'">
      </button>`;
    }).join('');

    $('#detalle').innerHTML = `
      <div class="detalle-hero">
        <img class="detalle-hero__img" src="assets/img/plazas/plaza-${slug}.jpg" alt="Vista general de ${esc(d.nombre)}"
             onerror="this.outerHTML='<div class=&quot;detalle-hero__ph&quot;><i class=&quot;bi bi-tree&quot;></i></div>'">
        <div class="detalle-hero__scrim"></div>
        <div class="detalle-hero__body">
          <span class="barrio"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> ${esc(d.barrio)}</span>
          <h1>${esc(d.nombre)}</h1>
          <div class="detalle-hero__pills">
            <span class="pill"><i class="bi bi-calendar3"></i> ${esc(d.anio)}</span>
            <span class="pill"><i class="bi bi-rulers"></i> ${esc(d.superficie)}</span>
          </div>
        </div>
      </div>

      <div class="detalle-cuerpo">
        <div>
          <h2>Sobre la plaza</h2>
          <p class="prosa" style="font-size:var(--fs-lg)">${esc(d.intro)}</p>

          <h2>Historia</h2>
          ${d.historia.map(p => `<p class="prosa">${esc(p)}</p>`).join('')}

          <h2>Galería</h2>
          <p class="text-soft">Imágenes de referencia. <em>Se cargan según <code>IMAGENES.md</code>.</em></p>
          <div class="galeria">${galeria}</div>

          <h2>Cómo llegar</h2>
          <p><i class="bi bi-pin-map" aria-hidden="true"></i> ${esc(d.direccion)}</p>
          <div class="mapa">
            <img src="assets/img/plazas/mapa-${slug}.png" alt="Mapa de ubicación de ${esc(d.nombre)}"
                 onerror="this.outerHTML='<div class=&quot;ph&quot;><div><i class=&quot;bi bi-map&quot;></i><p class=&quot;mb-0 mt-2&quot;>Espacio para el mapa de ubicación.<br>Se reemplaza por una imagen estática o un mapa embebido.</p></div></div>'">
          </div>

          <div class="detalle-nav">
            ${prev ? `<a href="plaza.html?plaza=${prev}"><i class="bi bi-arrow-left"></i> ${esc(PLAZAS_DETALLE[prev].nombre)}</a>` : '<span></span>'}
            <a href="index.html#plazas">Todas las plazas <i class="bi bi-grid"></i></a>
            ${next ? `<a href="plaza.html?plaza=${next}">${esc(PLAZAS_DETALLE[next].nombre)} <i class="bi bi-arrow-right"></i></a>` : '<span></span>'}
          </div>
        </div>

        <aside class="ficha" aria-label="Ficha técnica">
          <h2>Ficha técnica</h2>
          <dl>
            <div><dt>Barrio</dt><dd>${esc(d.barrio)}</dd></div>
            <div><dt>Año</dt><dd>${esc(d.anio)}</dd></div>
            <div><dt>Superficie</dt><dd>${esc(d.superficie)}</dd></div>
            <div><dt>Equipamiento</dt><dd><ul>${d.equipamiento.map(e => `<li>${esc(e)}</li>`).join('')}</ul></dd></div>
            <div><dt>Arbolado</dt><dd><ul>${d.arbolado.map(e => `<li>${esc(e)}</li>`).join('')}</ul></dd></div>
            <div><dt>Accesibilidad</dt><dd>${esc(d.accesibilidad)}</dd></div>
          </dl>
        </aside>
      </div>`;

    // lightbox de galería (dialog nativo)
    const lb = $('#lightbox'), lbImg = $('#lightbox-img');
    $('#detalle').querySelectorAll('.galeria button').forEach(b => {
      b.addEventListener('click', () => {
        if (b.querySelector('.ph')) return;          // sin imagen real, no abre
        lbImg.src = b.dataset.img; lbImg.alt = b.dataset.cap;
        if (typeof lb.showModal === 'function') lb.showModal();
      });
    });
  }
  </script>
</body>
</html>
