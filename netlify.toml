# Configuración de despliegue — Espacios Verdes y Plazas (Catamarca Capital)
# Sitio estático: no hay build, se publica la carpeta tal cual.

[build]
  publish = "."
  command = ""

# El sitio usa links relativos a archivos .html "a mano" (index.html, plaza.html,
# secretaria.html), no rutas "lindas". Sin esto, el post-procesado de Netlify
# reescribe cualquier href="index.html" a href="/" — lo que, combinado con el
# redirect forzado de abajo, hacía que esos links volvieran a mostrar
# secretaria.html en vez de index.html.
[build.processing.html]
  pretty_urls = false

# La home ("/") muestra la página de la Secretaría (secretaria.html).
# Es un rewrite (status 200): la URL sigue siendo la raíz del sitio, no cambia
# a /secretaria.html. index.html (Espacios Verdes) sigue disponible en su URL.
# force = true es necesario: como index.html existe en la raíz, Netlify lo serviría
# como default de "/" e ignoraría este redirect sin el force.
[[redirects]]
  from = "/"
  to = "/secretaria.html"
  status = 200
  force = true

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los logos son inmutables: cache largo
[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML se revalida siempre (es un mockup en iteración)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
