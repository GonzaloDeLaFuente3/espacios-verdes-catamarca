# Configuración de despliegue — Espacios Verdes y Plazas (Catamarca Capital)
# Sitio estático: no hay build, se publica la carpeta tal cual.

[build]
  publish = "."
  command = ""

# Cabeceras de seguridad para todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los logos son inmutables: cache largo
[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML se revalida siempre (es un mockup en iteración)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
